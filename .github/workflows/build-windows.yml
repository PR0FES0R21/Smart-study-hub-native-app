name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare Flutter
        run: |
          flutter config --no-analytics
          flutter --version
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Check source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows application
        run: flutter build windows --release

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Study-Hub-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
